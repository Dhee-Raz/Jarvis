name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }} and JavaScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python API tests
        run: python -m unittest -v
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: JavaScript interface and vision tests
        run: node --test test_interface.cjs test_live_vision.cjs
      - name: Check patch whitespace
        run: git diff --check
